[project]
name = "ecommerce-rag-engine"
version = "0.3.0"
description = "Hybrid search and RAG for e-commerce product discovery, with retrieval and answer-quality evaluation."
readme = "README.md"
requires-python = ">=3.11"
# The API service. Pinned to the same versions as requirements-backend.txt, which the
# backend Docker image installs; a test keeps the two identical.
dependencies = [
    "fastapi==0.138.1",
    "fastembed==0.8.0",
    "groq==1.5.0",
    "httpx==0.28.1",
    "loguru==0.7.3",
    "prometheus-client==0.21.1",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "pydantic_core==2.46.4",
    "qdrant-client==1.18.0",
    "redis==8.0.1",
    "tenacity==9.1.4",
    "uvicorn==0.49.0",
]

[dependency-groups]
# The Streamlit UI (requirements-frontend.txt); also needed by the evaluation scripts (pandas).
frontend = [
    "pandas==3.0.3",
    "requests==2.34.2",
    "streamlit==1.58.0",
]
dev = [
    { include-group = "frontend" },
    "pre-commit==4.2.0",
    "pytest==8.4.2",
    "ruff==0.15.20",
]

[tool.uv]
package = false          # an application, not a library to publish
default-groups = ["frontend", "dev"]
